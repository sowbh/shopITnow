<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shopITnow | Products</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- favicon -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/imgs/shopit.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/imgs/shopit.png">

    <!-- Global CSS -->
    <link rel="stylesheet" href="../styles.css" />

    <!-- Product CSS -->
    <link rel="stylesheet" href="../css/products.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="products.html"> shopITnow </a>

        <div class="d-flex gap-2">
          <a
            id="adminDashboardBtn"
            href="../admin/dashboard.html"
            class="btn btn-success d-none"
          >
            Admin Dashboard
          </a>

          <button id="themeToggle" class="btn btn-outline-warning">🌙</button>

          <button onclick="logoutUser()" class="btn btn-danger">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <!-- Search Section -->
      <div class="glass p-4 mb-4" id="searchSection">
        <h2 class="text-center mb-4">Products</h2>

        <div class="row">
          <div class="col-md-8 mx-auto">
            <div class="input-group">
              <input
                type="search"
                id="searchInput"
                class="form-control"
                placeholder="Search products..."
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Product Grid -->
      <div id="productContainer" class="product-grid"></div>

      <!-- Single Product Details -->
      <div id="productDetails" class="product-details-card glass d-none"></div>
    </div>

    <!-- Common Script -->
    <script src="../script.js"></script>

    <!-- Auth Script -->
    <script type="module" src="../auth/auth.js"></script>

    <!-- Product Script -->
    <script type="module" src="./products.js"></script>
  </body>
</html>
