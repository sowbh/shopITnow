<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>shopITnow | Admin Login</title>

    <!-- favicon -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/imgs/admin-panel.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/imgs/admin-panel.png"
    />

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Global CSS -->

    <link rel="stylesheet" href="../styles.css" />

    <!-- Admin CSS -->

    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-5 col-md-7">
          <div class="glass p-5">
            <h1 class="text-center mb-3">shopITnow Admin</h1>

            <p class="text-center mb-4">Admin Login Panel</p>

            <div id="adminAlert" class="alert alert-danger d-none"></div>

            <form id="adminLoginForm">
              <div class="mb-3">
                <label class="form-label"> Email </label>

                <input
                  type="email"
                  id="adminEmail"
                  class="form-control"
                  placeholder="Enter admin email"
                />
              </div>

              <div class="mb-3">
                <label class="form-label"> Password </label>

                <div class="input-group">
                  <input
                    type="password"
                    id="adminPassword"
                    class="form-control"
                    placeholder="Enter admin password"
                  />

                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="toggleAdminPassword"
                  >
                    👁
                  </button>
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100"
                id="adminLoginBtn"
              >
                Login as Admin
              </button>

              <div class="text-end mt-2">
                <a href="#" id="forgotAdmin"> Forgot Credentials? </a>
              </div>
            </form>

            <hr class="my-4" />

            <div class="text-center">
              <a href="../index.html"> Back to User Login </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common Script -->

    <script src="../script.js"></script>

    <!-- Admin Script -->

    <script type="module" src="./admin.js"></script>
  </body>
</html>
