<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>shopITnow | Admin Dashboard</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- favicon -->
    <link
      rel="icon"
      type="image/png"
      href="../assets/imgs/dashboard.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/imgs/dashboard.png"
    />

    <!-- Global CSS -->

    <link rel="stylesheet" href="../styles.css" />

    <!-- Admin CSS -->

    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html"> shopITnow Admin </a>

        <div class="d-flex gap-2">
          <a href="../products/products.html" class="btn btn-success">
            User Dashboard
          </a>

          <button id="themeToggle" class="btn btn-outline-warning">🌙</button>

          <button onclick="logoutAdmin()" class="btn btn-danger">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <h1 class="text-center mb-5">Admin Dashboard</h1>

      <!-- Dashboard Cards -->

      <div class="row g-4 mb-5">
        <div class="col-md-4">
          <div class="glass p-4 text-center">
            <h5>Total Products</h5>

            <h2 id="totalProducts">0</h2>
          </div>
        </div>

        <div class="col-md-4">
          <div class="glass p-4 text-center">
            <h5>Total Users</h5>

            <h2 id="totalUsers">0</h2>
          </div>
        </div>

        <div class="col-md-4">
          <div class="glass p-4 text-center">
            <h5>Orders</h5>

            <h2 id="totalOrders">0</h2>
          </div>
        </div>
      </div>

      <!-- Add Product -->

      <div class="glass p-4 mb-5">
        <h3 class="mb-4">Add Product</h3>

        <form id="productForm">
          <div class="row g-3">
            <div class="col-md-6">
              <input
                type="text"
                id="productTitle"
                class="form-control"
                placeholder="Product title"
              />
            </div>

            <div class="col-md-6">
              <input
                type="number"
                id="productPrice"
                class="form-control"
                placeholder="Price"
              />
            </div>

            <div class="col-md-6">
              <input
                type="text"
                id="productCategory"
                class="form-control"
                placeholder="Category"
              />
            </div>

            <div class="col-md-6">
              <input
                type="text"
                id="productImage"
                class="form-control"
                placeholder="Image URL"
              />
            </div>

            <div class="col-12">
              <textarea
                id="productDescription"
                class="form-control"
                rows="4"
                placeholder="Product description"
              ></textarea>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary">Add Product</button>
            </div>
          </div>
        </form>
      </div>

      <!-- Product Management -->

      <div class="glass p-4 mb-5">
        <h3 class="mb-4">Manage Products</h3>

        <div class="table-responsive">
          <table class="table table-hover admin-table">
            <thead>
              <tr>
                <th>Image</th>

                <th>Title</th>

                <th>Price</th>

                <th>Category</th>

                <th>Action</th>
              </tr>
            </thead>

            <tbody id="adminProductList"></tbody>
          </table>
        </div>
      </div>

      <!-- Users -->

      <div class="glass p-4">
        <h3>Users</h3>

        <div id="userList">No users loaded.</div>
      </div>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common Script -->

    <script src="../script.js"></script>

    <!-- Admin Script -->

    <script type="module" src="./admin.js"></script>
  </body>
</html>
