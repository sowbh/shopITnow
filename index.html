<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>shopITnow | Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />

    <!-- favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./assets/imgs/letter-s.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/imgs/letter-s.png"
    />
  </head>

  <body>
    <div class="position-absolute top-0 end-0 m-4">
      <button id="themeToggle" class="btn btn-outline-warning">🌙</button>
    </div>

    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-5 col-md-7 col-sm-10">
          <div class="glass p-4 p-md-5">
            <h1 class="text-center mb-2">shopITnow</h1>

            <p class="text-center mb-4">Your Premium Shopping Experience</p>

            <div id="authAlert" class="alert alert-danger d-none"></div>

            <ul class="nav nav-pills mb-4 justify-content-center">
              <li class="nav-item">
                <button class="nav-link active" id="loginTab">Login</button>
              </li>

              <li class="nav-item">
                <button class="nav-link" id="registerTab">Register</button>
              </li>
            </ul>

            <!-- Login Form -->

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label"> Email </label>

                <input
                  type="email"
                  id="loginEmail"
                  class="form-control"
                  placeholder="Enter email"
                />
              </div>

              <div class="mb-3">
                <label class="form-label"> Password </label>

                <div class="input-group">
                  <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Enter password"
                  />

                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="toggleLoginPassword"
                  >
                    👁
                  </button>
                </div>
              </div>

              <button type="submit" id="loginBtn" class="btn btn-primary w-100">
                <span class="btn-text"> Login </span>

                <span class="spinner-border spinner-border-sm d-none"></span>
              </button>

              <div class="text-end mt-2">
                <a href="#" id="forgotPassword"> Forgot Password? </a>
              </div>
            </form>

            <!-- Register Form -->

            <form id="registerForm" class="d-none">
              <div class="mb-3">
                <label class="form-label"> Full Name </label>

                <input
                  type="text"
                  id="registerName"
                  class="form-control"
                  placeholder="Enter name"
                />
              </div>

              <div class="mb-3">
                <label class="form-label"> Email </label>

                <input
                  type="email"
                  id="registerEmail"
                  class="form-control"
                  placeholder="Enter email"
                />
              </div>

              <div class="mb-3">
                <label class="form-label"> Password </label>

                <div class="input-group">
                  <input
                    type="password"
                    id="registerPassword"
                    class="form-control"
                    placeholder="Create password"
                  />

                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="toggleRegisterPassword"
                  >
                    👁
                  </button>
                </div>
              </div>

              <button
                type="submit"
                id="registerBtn"
                class="btn btn-primary w-100"
              >
                <span class="btn-text"> Create Account </span>

                <span class="spinner-border spinner-border-sm d-none"></span>
              </button>
            </form>

            <hr class="my-4" />

            <!-- Google Login -->

            <button id="googleLogin" class="btn btn-danger w-100 mb-3">
              Continue with Google
            </button>

            <!-- Phone Login -->
            <button
              id="phoneLogin"
              class="btn btn-dark w-100 position-relative"
            >
              Continue with Phone OTP
              <span class="badge bg-warning text-dark ms-2"
                >Under Construction</span
              >
            </button>

            <hr class="my-4" />

            <p class="text-center">
              Are you an Admin?

              <a href="./admin/admin.html"> Click Here </a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./script.js"></script>

    <script type="module" src="./auth/auth.js"></script>
  </body>
</html>
